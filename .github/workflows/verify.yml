name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Views must be built before the server can serve them, and before the
      # contract test can read one back over the wire.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      # The external Alexa+ conformance checker, run against a real booted server.
      - run: pnpm conformance
