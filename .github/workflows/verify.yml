name: verify

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be started without inventing a commit to trigger one. This mattered when
  # the workflow had never executed: every run between 2026-09-29 and 2026-10-05 was refused
  # before the job started, and there was no way to retry one except by pushing again.
  workflow_dispatch:

# Nothing here writes to the repository, and a fork's pull request should not be able to.
permissions:
  contents: read

# One run per ref. A superseded push has nothing to tell us, and the queue is shared.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The whole job takes ~80s, up from ~47s as gates were added. Ten minutes is generous
    # and still far from the 360-minute default a hung step would otherwise burn.
    timeout-minutes: 10

    # DynamoDB Local, so the ledger adapter is actually tested here.
    #
    # Without this the adapter's tests found nothing at 127.0.0.1:8000, skipped, and the job
    # went green — so the store that holds the household's ledger, its atomic sequence
    # counter and its append-only guarantee had no automated coverage at all. It was checked
    # only when somebody remembered to start Docker locally.
    #
    # No health check is declared because the image serves a Java process that answers HTTP
    # 400 to a bare GET, which `--health-cmd` cannot easily assert on; the test file polls
    # for readiness itself instead, and OWED_REQUIRE_DYNAMO below makes a container that
    # never comes up a failure rather than a silent skip.
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the build, because this is what a cross-package import missing its tsconfig
      # reference looks like when it is not caught: `tsc -b` builds independent projects
      # concurrently, so the import resolves or does not depending on which finishes first.
      # It cost three green runs and one red one to notice.
      - run: pnpm verify:graph

      # The documents, which nothing read until now. Entry numbers in the friction log are
      # cited from two other files, so renumbering one breaks a reference that looks fine
      # in every diff. Structure only — whether any of it is true is still a person's job.
      - run: pnpm verify:docs

      # Views must be built before the server can serve them, and before the
      # contract test can read one back over the wire.
      - run: pnpm build

      - run: pnpm lint

      # OWED_REQUIRE_DYNAMO turns this suite's one conditional skip into a failure. The skip
      # is correct on a laptop — a clean clone must run `pnpm verify` green with nothing
      # installed — and wrong here, where skipping silently would report coverage of the
      # DynamoDB adapter while testing none of it.
      - run: pnpm test
        env:
          OWED_REQUIRE_DYNAMO: "1"

      # The same suite in a second timezone, because its independence was accidental.
      #
      # Nothing in this repository sets `TZ`, and nothing claimed the suite was
      # zone-independent — it simply was, as a by-product of real discipline: `clock.ts`
      # forbids a bare `new Date()` elsewhere, the arithmetic is all `Date.UTC` and
      # `getUTCDay`, and a grep for every local-time accessor (`getHours`, `getDay()`,
      # `toLocaleString`, `getTimezoneOffset`, …) across the whole tree returns zero hits.
      # So it passed here in UTC and on a developer machine at +05:30, and nobody knew that
      # was being tested or would have noticed it breaking in one zone only.
      #
      # That matters for this product specifically: the demo's central beat fires on
      # *crossing* one instant, Sunday 18:25, and a zone-dependent regression would make it
      # look broken on a judge's machine rather than on ours.
      #
      # +14 and across the date line, so local date != UTC date — the case a negative or
      # half-hour offset cannot catch. Deliberately a second run rather than `TZ` in
      # `vitest.config.ts`: fixing the zone for everyone would collapse the incidental
      # diversity that is currently the evidence. Verified locally under UTC,
      # America/New_York and Pacific/Kiritimati before being pinned here — all green, and
      # ~9s each, so this is the cheapest coverage in the job.
      - run: pnpm test
        env:
          TZ: Pacific/Kiritimati
          OWED_REQUIRE_DYNAMO: "1"

      # The published numbers, re-derived rather than read.
      #
      # `verify:docs` above checks every figure in the readme against `eval/results/*.json`.
      # Those files are committed artifacts regenerated by hand, so that pair can agree
      # perfectly about code that no longer exists: change a detector and `breach.json`
      # still describes the one you used to have, with the readme faithfully citing it.
      #
      # This runs the five deterministic harnesses and compares figure by figure. It is
      # also the only place the comparison is made on a different platform from the one
      # the reports were generated on — macOS arm64 to Linux x64 — which is the claim that
      # they are a function of the code and a fixed seed and nothing else.
      #
      # Listed as its own step rather than reached through `pnpm verify`, because this job
      # has always run the gates individually: adding one to that script alone would leave
      # it out of CI entirely, which is how this step came to be written.
      - run: pnpm verify:eval

      # The external Alexa+ conformance checker, run against a real booted server.
      - run: pnpm conformance

      # Caddy, so the deployment gate below can validate the Caddyfile rather than report
      # it as skipped. Lifted out of the official image at a pinned version instead of
      # added as an apt repository: one file, no third-party source list, and the runner
      # already has Docker. `caddy validate` adapts the Caddyfile and builds the whole
      # config, which is the only thing that reads those 150 lines at all.
      - name: Provide caddy to the deployment gate
        run: |
          docker create --name caddy-bin caddy:2.11.4-alpine
          docker cp caddy-bin:/usr/bin/caddy /usr/local/bin/caddy
          docker rm caddy-bin
          caddy version

      # The deployment, which until now was the one directory with nothing automated
      # pointed at it. The structural checks run anywhere; this runner is where all three
      # real validators exist, so it is the only place those files get genuinely read — a
      # Mac reports the validators as skipped.
      #
      # OWED_REQUIRE_VALIDATORS makes a skip here a failure, for the same reason
      # OWED_REQUIRE_DYNAMO exists above: without it, the caddy step breaking or a runner
      # image dropping shellcheck would turn all three validators into no-ops and this gate
      # would still go green, reporting that 150 lines of Caddyfile and four systemd units
      # had been read when nothing had read them.
      - run: pnpm verify:deploy
        env:
          OWED_REQUIRE_VALIDATORS: "1"
